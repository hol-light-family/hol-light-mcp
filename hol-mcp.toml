# HOL Light MCP server configuration.
# Loaded by default from the current directory, else from the hol-light-mcp
# checkout. To use a different config, pass --config /absolute/path/to/hol-mcp.toml.

# HOL Light checkout. Relative paths are resolved against this file.
# Overridden by --hol-dir or the HOL_LIGHT_DIR environment variable.
# hol_dir = "/path/to/hol-light"

# Which checkpoint to use (looks for hol-<name>.ckpt/ in the HOL Light dir).
# Create with: python3 make_checkpoint.py --name <name> [options]
checkpoint = "base"

# Timeout in seconds for HOL Light commands.
timeout = 600

# Maximum characters for eval output before truncation.
max_output_chars = 4000

# Auto-record proof tactics to this directory (recording.jsonl).
# Relative paths resolved against CWD. Also settable via HOL_RECORDING_DIR env var.
# recording_dir = "/path/to/work"

# Replay a tactic prefix on startup to restore proof state.
# replay_init: ML file to #use before replaying (e.g., load project dependencies).
# replay_prefix: JSONL file of tactics to replay (same format as recording.jsonl).
# Also settable via HOL_REPLAY_INIT and HOL_REPLAY_PREFIX env vars.
# replay_init = "/path/to/init.ml"
# replay_prefix = "/path/to/prefix.jsonl"

# Recipes describe how hol_restart(rebuild_hol_and_checkpoint=true) rebuilds a
# checkpoint. Relative include directories are resolved against this config file.
# The "base" checkpoint is vanilla HOL Light and can be rebuilt without a recipe;
# every other checkpoint MUST define one here or the rebuild fails (we never
# rebuild a custom checkpoint as bare HOL).
#
# Example recipe with s2n-bignum ARM infrastructure. Uncomment and adjust
# include_dirs to your s2n-bignum checkout to enable
# hol_restart(checkpoint="gcm", rebuild_hol_and_checkpoint=true).
# [checkpoint_recipes.gcm]
# include_dirs = ["/path/to/s2n-bignum"]
# loads = ['needs "arm/proofs/base.ml"', 'needs "common/gcm.ml"']

# Optional static source lookup: the definition_source tool, from the
# hol-language-server submodule. It parses sources and never runs HOL Light.
# Also enabled by --enable-language-server. Read once at startup; hol_restart
# does not reload it.
[language_server]
enabled = false
# Project root, searched for .ml/.hl files and used for {workspace} below.
# Relative paths are resolved against this file. Default: the current directory.
# Overridden by --language-server-workspace (relative to the current directory).
# workspace = "/path/to/s2n-bignum"
# Where `needs "..."` paths are searched, in order. `.` is the loading file's
# directory; {hol} is hol_dir.
# root_paths = [".", "{hol}", "{workspace}"]
# Index every .ml/.hl file of the workspace at startup (default true).
# index_workspace = true
# The project's own commands that behave like needs / prove / new_definition.
# custom_imports = []
# custom_theorems = []
# custom_definitions = []
